[package]
name = "kit-server-http"
version = "0.0.0"
edition = "2024"

[dependencies]
async-stream = "0.3.6"
axum = "0.8.9"
bytes = "1.10.1"
kit-server-runtime = { path = "../../../../../../compiler/rust/runtime" }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["net", "sync", "time"] }
tower = "0.5.2"
tower-http = { version = "0.6.6", features = ["catch-panic", "limit", "request-id", "timeout"] }
url = "2.5.7"
