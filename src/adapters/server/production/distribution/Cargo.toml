[package]
name = "kit-server-distribution"
version = "0.0.0"
edition = "2024"

[dependencies]
async-nats = "0.49.1"
async-stream = "0.3.6"
base64 = "0.22.1"
futures-util = "0.3.31"
kit-server-runtime = { path = "../runtime" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["macros", "rt", "sync", "time"] }
